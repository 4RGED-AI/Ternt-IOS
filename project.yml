name: Ternt
options:
  bundleIdPrefix: com.tern.household
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  SWIFT_VERSION: "5.0"
  MARKETING_VERSION: "0.1.0"
  CURRENT_PROJECT_VERSION: "1"
  TARGETED_DEVICE_FAMILY: "1"
  GENERATE_INFOPLIST_FILE: YES
  INFOPLIST_KEY_CFBundleDisplayName: TERN
  INFOPLIST_KEY_UILaunchScreen_Generation: YES
  INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
  INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Add a photo to your profile.
  INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
packages:
  ChatLayout:
    url: https://github.com/ekazaev/ChatLayout
    from: 2.4.2
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 7.10.0
  Nuke:
    url: https://github.com/kean/Nuke
    from: 13.0.0
  Dependencies:
    url: https://github.com/pointfreeco/swift-dependencies
    from: 1.12.0
  IdentifiedCollections:
    url: https://github.com/pointfreeco/swift-identified-collections
    from: 1.1.0
  Tagged:
    url: https://github.com/pointfreeco/swift-tagged
    from: 0.10.0
  Collections:
    url: https://github.com/apple/swift-collections
    from: 1.5.1
  Clocks:
    url: https://github.com/pointfreeco/swift-clocks
    from: 1.0.6
targets:
  Ternt:
    type: application
    platform: iOS
    sources:
      - Ternt
    dependencies:
      - package: ChatLayout
        product: ChatLayout
      - package: GRDB
        product: GRDB
      - package: Nuke
        product: Nuke
      - package: Nuke
        product: NukeUI
      - package: Dependencies
        product: Dependencies
      - package: IdentifiedCollections
        product: IdentifiedCollections
      - package: Tagged
        product: Tagged
      - package: Collections
        product: Collections
      - package: Clocks
        product: Clocks
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.tern.household.ios
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      CODE_SIGN_STYLE: Automatic
      DEVELOPMENT_TEAM: RC39G7HHG3
schemes:
  Ternt:
    build:
      targets:
        Ternt: all
    run:
      config: Debug
